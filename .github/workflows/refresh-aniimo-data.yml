name: Refresh Aniimo Data

on:
  schedule:
    - cron: "18 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate bundled Aniimo data
        run: node scripts/scrape-aniimo.js

      - name: Commit data changes
        run: |
          if git diff --quiet -- data/aniimo.json data/aniimo-data.js; then
            echo "No Aniimo data changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aniimo.json data/aniimo-data.js
          git commit -m "Refresh Aniimo Homeland data"
          git push
